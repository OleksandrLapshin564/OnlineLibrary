{% extends "core/base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Register</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success" type="submit">Register</button>
    </form>
    <p class="mt-2">Already have an account? <a href="{% url 'users:login' %}">Login</a></p>
</div>
{% endblock %}
