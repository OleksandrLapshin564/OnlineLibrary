{% extends "main/base.html" %}

{% block title %}Register - Online Library{% endblock %}

{% block content %}
<div class="container mt-5 col-md-6">
    <h2>Register</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success w-100 mt-2" type="submit">Register</button>
    </form>
    <p class="mt-3 text-center">Already have an account? <a href="{% url 'users:login' %}">Login</a></p>
</div>
{% endblock %}
