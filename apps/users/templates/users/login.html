{% extends "main/base.html" %}

{% block title %}Login - Online Library{% endblock %}

{% block content %}
<div class="container mt-5 col-md-5">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100 mt-2" type="submit">Login</button>
    </form>
    <p class="mt-3 text-center">Don't have an account? <a href="{% url 'users:register' %}">Register</a></p>
</div>
{% endblock %}
