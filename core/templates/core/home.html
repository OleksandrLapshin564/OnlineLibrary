{% load static %}
{% extends "core/base.html" %}

{% block content %}
<div class="container mt-5">
    <h1>Welcome to OnlineLibrary</h1>

    {% if user.is_authenticated %}
        <p>Hello, {{ user.username }}!</p>
        <a class="btn btn-warning" href="{% url 'users:logout' %}">Logout</a>
    {% else %}
        <p>You are not logged in.</p>
        <a class="btn btn-primary" href="{% url 'users:login' %}">Login</a>
        <a class="btn btn-success" href="{% url 'users:register' %}">Register</a>
    {% endif %}
</div>
{% endblock %}
